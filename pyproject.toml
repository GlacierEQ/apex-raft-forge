[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "apex-raft-forge"
version = "1.0.0"
description = "Production-grade Apex Raft Forge system with strict contract enforcement, receipt-backed operations, and verified test c"
requires-python = ">=3.11"
dependencies = []
keywords = ["contracts", "receipts", "verification"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
